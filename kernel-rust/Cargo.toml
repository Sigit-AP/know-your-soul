[package]
name = "know-your-soul-kernel"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic tree-sitter extraction kernel for know-your-soul (byte-identical to the Python reference extractor)"
publish = false

# Grammar pinning rationale (see docs/recovery/w5-rust-kernel.md):
# the Python reference uses tree-sitter-language-pack 1.22.1, whose bundled
# grammar revisions come from its grammar-provenance manifest. Nine grammars
# are parse-identical to a crates.io release (verified by comparing the
# grammar src/ tree at the bundled rev against every tag); those are pinned
# with "=" below. python/cpp/csharp changed grammar rules after their last
# crates.io release, so they are pinned to the exact bundled git revisions.

[lib]
name = "know_your_soul_kernel"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kys-kernel"
path = "src/main.rs"

[features]
default = []
pyo3 = ["dep:pyo3"]

[dependencies]
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.1"
tree-sitter-c = "=0.24.2"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-php = "=0.25.1"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-python = { git = "https://github.com/tree-sitter/tree-sitter-python", rev = "26855eabccb19c6abf499fbc5b8dc7cc9ab8bc64" }
tree-sitter-cpp = { git = "https://github.com/tree-sitter/tree-sitter-cpp", rev = "c009222808634c1014f82438d4883753516a2c24" }
tree-sitter-c-sharp = { git = "https://github.com/tree-sitter/tree-sitter-c-sharp", rev = "8c0abe0b84a3681d3e6852ce2e2a1eecb4f731c5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
pyo3 = { version = "0.30", optional = true }

[profile.release]
opt-level = 3
