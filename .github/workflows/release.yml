name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # upload artifacts to the GitHub Release
  id-token: write # PyPI trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match project version ${version}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        # Opt-in: only runs when repo variable PYPI_PUBLISH_ENABLED=true is set
        # (requires a configured PyPI trusted publisher). GitHub Release upload
        # below always runs on tags.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH_ENABLED == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload artifacts to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
